<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; min-height:100%; width:100%; max-width:100%; overflow-x:hidden; }
  /* no background on html → body's background propagates to the canvas and fills
     the whole screen, safe areas and overscroll included. No band, ever. */
  body {
    background:
      radial-gradient(120% 42% at 100% 0%, rgba(255,255,255,0.16), transparent 62%),
      radial-gradient(100% 34% at 0% 46%, rgba(255,210,150,0.16), transparent 62%),
      radial-gradient(90% 30% at 100% 88%, rgba(0,229,196,0.13), transparent 62%),
      linear-gradient(178deg, #5B34D6 0%, #6C3FE0 12%, #8B45CE 30%, #C8541F 50%, #F2610C 63%, #F97316 73%, #F79A6B 85%, #F5A9A0 94%, #F2988C 100%);
    background-attachment: fixed;
    background-repeat: no-repeat;
    min-height: 100vh;
  }
  #root { min-height:100%; }
  input, textarea, button { font-family:inherit; }
  button { -webkit-appearance:none; appearance:none; background:transparent; border:none; color:inherit; cursor:pointer; }
  input[type="time"], input[type="date"] { -webkit-appearance:none; appearance:none; }
  input[type="time"]::-webkit-date-and-time-value { text-align:left; }
  .scrollpane { min-height:100%; overflow:visible; -webkit-overflow-scrolling:touch; }
  ::-webkit-scrollbar { width:0; height:0; }

  @keyframes riseIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .rise { animation:riseIn 560ms cubic-bezier(.2,.85,.25,1) both; animation-delay:calc(var(--i,0) * 55ms); }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .fade { animation:fadeIn 400ms ease both; }
  @keyframes fadeSlide { from { opacity:0; transform:translateX(8px); } to { opacity:1; transform:translateX(0); } }
  .fade-slide { animation:fadeSlide 420ms cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i,0) * 45ms); }
  @keyframes popIn { 0% { opacity:0; transform:scale(.86); } 55% { transform:scale(1.04); } 100% { opacity:1; transform:scale(1); } }
  .pop { animation:popIn 400ms cubic-bezier(.2,.85,.25,1) both; }
  @keyframes barGrow { from { transform:scaleY(0); } to { transform:scaleY(1); } }
  .bar-grow { transform-origin:bottom; animation:barGrow 760ms cubic-bezier(.2,.85,.25,1) both; animation-delay:calc(var(--i,0) * 65ms); }
  @keyframes glowPulse { 0%,100% { opacity:.5; } 50% { opacity:1; } }
  .pulse { animation:glowPulse 2.4s ease-in-out infinite; }
  @keyframes sheen { from { background-position:-140% 0; } to { background-position:240% 0; } }
  .sheen { background:linear-gradient(100deg, rgba(184,247,255,0) 30%, rgba(184,247,255,0.14) 50%, rgba(184,247,255,0) 70%); background-size:200% 100%; animation:sheen 3.4s linear infinite; }
  @keyframes floatY { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-3px); } }
  .float { animation:floatY 4s ease-in-out infinite; }
  @keyframes ringPop { 0% { transform:scale(.7); opacity:0; } 100% { transform:scale(1); opacity:1; } }
  .ring-pop { animation:ringPop 500ms cubic-bezier(.2,.85,.25,1) both; }
  @keyframes countUp { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
  .count { animation:countUp 500ms ease both; }
  @keyframes hue { 0% { background-position:0% 50%; } 100% { background-position:100% 50%; } }
  .mood-track { background-size:220% 100%; animation:hue 7s ease-in-out infinite alternate; }
  @keyframes tintIn { from { opacity:0; } to { opacity:1; } }
  .tint-in { animation:tintIn 620ms ease both; }
  @keyframes thumbPop { 0% { transform:translate(-50%,-50%) scale(.6); } 60% { transform:translate(-50%,-50%) scale(1.12); } 100% { transform:translate(-50%,-50%) scale(1); } }
  .thumb-pop { animation:thumbPop 260ms cubic-bezier(.2,.85,.25,1) both; }

  .press { transition:transform 150ms cubic-bezier(.2,.8,.2,1), background 200ms ease, border-color 200ms ease, color 200ms ease, box-shadow 240ms ease; }
  .press:active { transform:scale(.94); }
  .jfocus:focus { border-color:rgba(108,63,224,0.6) !important; box-shadow:0 0 0 3px rgba(108,63,224,0.16) !important; }
  .chip { transition:transform 150ms cubic-bezier(.2,.8,.2,1), background 220ms ease, color 220ms ease, border-color 220ms ease, box-shadow 240ms ease; }
  .chip:active { transform:scale(.9); }
  .lift { transition:transform 220ms cubic-bezier(.2,.85,.25,1), box-shadow 260ms ease, border-color 220ms ease; }

  /* ---- micro-interactions ---- */
  @keyframes chevBob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(2px); } }
  .chev { animation:chevBob 1.8s ease-in-out infinite; transition:transform 300ms cubic-bezier(.2,.85,.25,1); }
  .chev.up { animation:none; transform:rotate(180deg); }
  @keyframes shine { from { background-position:-160% 0; } to { background-position:260% 0; } }
  .shine { position:relative; overflow:hidden; }
  .shine::after { content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:linear-gradient(105deg, transparent 34%, rgba(255,255,255,0.55) 50%, transparent 66%);
    background-size:220% 100%; animation:shine 4.5s ease-in-out infinite; }
  @keyframes springIn { 0% { opacity:0; transform:translateY(10px) scale(.96); } 60% { transform:translateY(-2px) scale(1.012); } 100% { opacity:1; transform:translateY(0) scale(1); } }
  .spring { animation:springIn 520ms cubic-bezier(.2,.9,.25,1) both; animation-delay:calc(var(--i,0) * 60ms); }
  @keyframes slideDown { from { opacity:0; transform:translateY(-6px); max-height:0; } to { opacity:1; transform:translateY(0); max-height:600px; } }
  .slide-down { animation:slideDown 380ms cubic-bezier(.2,.85,.25,1) both; }
  @keyframes breathe { 0%,100% { transform:scale(1); opacity:.85; } 50% { transform:scale(1.08); opacity:1; } }
  .breathe { animation:breathe 3s ease-in-out infinite; }
  @keyframes numTick { 0% { transform:translateY(6px); opacity:0; } 100% { transform:translateY(0); opacity:1; } }
  .tick-in { animation:numTick 420ms cubic-bezier(.2,.9,.25,1) both; }
  @keyframes iconWiggle { 0%,100% { transform:rotate(0); } 30% { transform:rotate(-8deg); } 60% { transform:rotate(6deg); } }
  .wiggle:active > span:first-child { animation:iconWiggle 420ms ease; }
  .press:active { transform:scale(.94); }
  .glass-hit { transition:background 220ms ease, box-shadow 240ms ease, transform 160ms cubic-bezier(.2,.8,.2,1); }
  .glass-hit:active { transform:scale(.97); background:rgba(255,255,255,0.5); }
</style>

<body>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const STORAGE_KEY = "habit-tracker-v1";
const APP_VERSION = "2026-08-15.6";

/* ---------- SUNSET · violet → orange → blush, mint accent ---------- */
const P = {
  bg: "#6C3FE0", bgDeep: "#F9C6D4",
  text: "#17132B",
  dim: "#4B4363",
  faint: "rgba(23,19,43,0.42)",
  slate: "#6E6684",
  teal: "#5B21D6", loss: "#D2214F", ice: "#00B89C",
  accent: "#5B21D6",
  good: "#00B89C", warn: "#F97316", bad: "#D2214F",
  mint: "#00E5C4", violet: "#6C3FE0", orange: "#F97316",
  tealTint: "rgba(91,33,214,0.10)", lossTint: "rgba(210,33,79,0.10)",
  iceTint: "rgba(0,229,196,0.16)", slateTint: "rgba(110,102,132,0.14)",
  card: "rgba(255,255,255,0.42)", cardHi: "rgba(255,255,255,0.28)",
  border: "rgba(23,19,43,0.09)",
  track: "rgba(23,19,43,0.10)",
};
const GRAD_PRIMARY = "linear-gradient(135deg, #00E5C4 0%, #16D7B5 100%)";   /* mint CTA · purple text */
const GRAD_VIOLET  = "linear-gradient(135deg, #6C3FE0 0%, #8B4BD8 100%)";   /* violet · white text */
const INK_ON_MINT = "#3B14C4";

/* per-card identity hues — all inside the sunset family */
const HUE = {
  sleep:    { c: "#6C3FE0", tint: "rgba(108,63,224,0.13)", glow: "rgba(108,63,224,0.20)" },
  reels:    { c: "#F2610C", tint: "rgba(242,97,12,0.13)",  glow: "rgba(242,97,12,0.20)" },
  briefing: { c: "#B23BB8", tint: "rgba(178,59,184,0.13)", glow: "rgba(178,59,184,0.20)" },
  mood:     { c: "#00A891", tint: "rgba(0,168,145,0.13)",  glow: "rgba(0,229,196,0.24)" },
  note:     { c: "#E0559A", tint: "rgba(224,85,154,0.12)", glow: "rgba(224,85,154,0.18)" },
  dream:    { c: "#7C4DFF", tint: "rgba(124,77,255,0.13)", glow: "rgba(124,77,255,0.20)" },
};
const MONO = "ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace";
const SANS = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif";

const GLASS = "linear-gradient(150deg, rgba(255,255,255,0.60) 0%, rgba(255,255,255,0.38) 46%, rgba(255,255,255,0.30) 100%)";
const GLASS_SHADOW = "inset 0 1px 0 rgba(255,255,255,0.75), inset 0 -1px 0 rgba(255,255,255,0.18), 0 14px 34px rgba(50,14,80,0.18)";
const card = (extra = {}) => ({
  background: GLASS,
  border: "1px solid rgba(255,255,255,0.42)",
  backdropFilter: "blur(26px) saturate(190%)", WebkitBackdropFilter: "blur(26px) saturate(190%)",
  boxShadow: GLASS_SHADOW,
  ...extra,
});

/* ---------- helpers ---------- */
const pad2 = (n) => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const nowHM = () => { const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const SLEEP_MIN = 7;

const hoursBetween = (bed, wake) => {
  if (!bed || !wake) return null;
  const [bh, bm] = bed.split(":").map(Number);
  const [wh, wm] = wake.split(":").map(Number);
  if ([bh,bm,wh,wm].some(isNaN)) return null;
  let mins = (wh*60+wm) - (bh*60+bm);
  if (mins <= 0) mins += 24*60;
  return Math.round((mins/60) * 100) / 100;
};
const fmtHours = (h) => h === null ? "—" : `${Math.floor(h)}h${pad2(Math.round((h - Math.floor(h))*60))}`;
const dayName = (iso) => new Date(iso+"T00:00:00").toLocaleDateString("en-GB", { weekday:"short" });
const dayNameLong = (iso) => new Date(iso+"T00:00:00").toLocaleDateString("en-GB", { weekday:"long" });
const prettyDate = (iso) => { const [y,m,d] = iso.split("-"); return `${parseInt(d)}.${parseInt(m)}.${y}`; };
const shiftISO = (iso, delta) => { const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+delta); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };

const avgMood = (day) => {
  if (!day || !day.moods || day.moods.length === 0) return null;
  return Math.round((day.moods.reduce((a,m) => a + m.v, 0) / day.moods.length) * 10) / 10;
};
const emptyDay = (iso) => ({ date: iso, bedtime: "", wake: "", sleepQ: null, rested: null, reels: null, reelsMins: "", briefing: null, moods: [], comments: [], note: "", dream: "" });
const dayHasData = (d) => !!(d.bedtime || d.wake || d.sleepQ != null || d.rested != null || d.reels !== null || d.briefing !== null || (d.moods && d.moods.length) || (d.comments && d.comments.length) || d.note || d.dream);
const isBrokenDay = (d) => {
  if (!d || !dayHasData(d)) return false;
  const h = hoursBetween(d.bedtime, d.wake), am = avgMood(d);
  return (h !== null && h < SLEEP_MIN) || d.briefing === false || (d.reels === true && (parseInt(d.reelsMins)||0) >= 30) || (am !== null && am < 3);
};
const brokenReasons = (d) => {
  const out = [], h = hoursBetween(d.bedtime, d.wake), am = avgMood(d);
  if (h !== null && h < SLEEP_MIN) out.push(`sleep ${fmtHours(h)}`);
  if (d.briefing === false) out.push("no briefing");
  if (d.reels === true && (parseInt(d.reelsMins)||0) >= 30) out.push("reels binge");
  if (am !== null && am < 3) out.push(`mood ${am}`);
  return out;
};

/* mood line */
const MoodLine = ({ days }) => {
  const pts = days.map((d) => avgMood(d));
  const W = 320, H = 100, pad = 12;
  const X = (i) => pad + 15 + (i / (days.length - 1)) * (W - 2*pad - 15);
  const Y = (v) => H - pad - ((v - 1) / 4) * (H - 2*pad);
  const real = pts.map((v, i) => ({ v, i })).filter((p) => p.v !== null);
  const path = real.map((p, k) => `${k === 0 ? "M" : "L"} ${X(p.i)} ${Y(p.v)}`).join(" ");
  const areaPath = real.length >= 2 ? `${path} L ${X(real[real.length-1].i)} ${H-pad} L ${X(real[0].i)} ${H-pad} Z` : "";
  const [on, setOn] = useState(false);
  const lineRef = useRef(null);
  const [len, setLen] = useState(600);
  useEffect(() => { if (lineRef.current) setLen(lineRef.current.getTotalLength()); const t = setTimeout(() => setOn(true), 100); return () => clearTimeout(t); }, []);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
      <defs>
        <linearGradient id="moodArea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor="#6C3FE0" stopOpacity="0.28" /><stop offset="1" stopColor="#6C3FE0" stopOpacity="0" />
        </linearGradient>
        <linearGradient id="moodLine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stopColor="#D2214F" /><stop offset="0.32" stopColor="#F2610C" />
          <stop offset="0.64" stopColor="#6C3FE0" /><stop offset="1" stopColor="#00C9AB" />
        </linearGradient>
      </defs>
      {[1,2,3,4,5].map((g) => (
        <React.Fragment key={g}>
          <line x1={pad+13} x2={W-pad} y1={Y(g)} y2={Y(g)} stroke="rgba(23,19,43,0.16)" strokeWidth={g === 3 ? 1.2 : 0.8} strokeDasharray={g === 3 ? "3 4" : "none"} />
          <text x={pad-1} y={Y(g)+3.5} fontSize="9.5" fontWeight="700" fill="rgba(23,19,43,0.5)" fontFamily="ui-monospace, monospace">{g}</text>
        </React.Fragment>
      ))}
      {real.length >= 2 && <path d={areaPath} fill="url(#moodArea)" style={{ opacity: on ? 1 : 0, transition: "opacity 700ms ease 400ms" }} />}
      {real.length >= 2 && (
        <path ref={lineRef} d={path} fill="none" stroke="url(#moodLine)" strokeWidth="3.4" strokeLinecap="round" strokeLinejoin="round"
          style={{ filter: "drop-shadow(0 2px 4px rgba(60,20,90,0.25))", strokeDasharray: len, strokeDashoffset: on ? 0 : len, transition: "stroke-dashoffset 1150ms ease" }} />
      )}
      {real.map((p, k) => (
        <circle key={p.i} cx={X(p.i)} cy={Y(p.v)} r={k === real.length-1 ? 5.4 : 4.4} fill={moodColor(Math.round(p.v))} stroke="#fff" strokeWidth="1.8"
          style={{ opacity: on ? 1 : 0, transition: `opacity 400ms ease ${500 + k*60}ms`, filter: "drop-shadow(0 1px 3px rgba(60,20,90,0.3))" }} />
      ))}
    </svg>
  );
};

/* 1–5 state scale · tap a card or drag across · big targets, sunset colours */
const MoodScale = ({ onPick }) => {
  const ref = useRef(null);
  const [val, setVal] = useState(null);
  const [dragging, setDragging] = useState(false);
  const [logged, setLogged] = useState(null);

  const calc = (clientX) => {
    const r = ref.current.getBoundingClientRect();
    const p = Math.max(0, Math.min(0.999, (clientX - r.left) / r.width));
    return 1 + Math.floor(p * 5);
  };
  const start = (e) => { setDragging(true); setLogged(null); setVal(calc(e.clientX)); try { ref.current.setPointerCapture(e.pointerId); } catch (_) {} };
  const move  = (e) => { if (dragging) setVal(calc(e.clientX)); };
  const end   = () => {
    if (dragging && val !== null) { onPick(val); setLogged(val); setTimeout(() => setLogged(null), 1600); setVal(null); }
    setDragging(false);
  };

  return (
    <div style={{ userSelect: "none" }}>
      <div ref={ref} onPointerDown={start} onPointerMove={move} onPointerUp={end} onPointerCancel={() => setDragging(false)}
        style={{ display: "flex", gap: 7, touchAction: "none" }}>
        {[1,2,3,4,5].map((n) => {
          const active = val === n;
          const just = logged === n;
          const c = moodColor(n);
          return (
            <div key={n} style={{ flex: 1, position: "relative", borderRadius: 18, overflow: "hidden",
                height: 74, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3,
                background: active || just ? c : `linear-gradient(150deg, rgba(255,255,255,0.42), ${c}18)`,
                border: `1.5px solid ${active || just ? c : `${c}3A`}`,
                backdropFilter: "blur(10px)", WebkitBackdropFilter: "blur(10px)",
                transform: active ? "translateY(-4px) scale(1.05)" : "scale(1)",
                boxShadow: active || just ? `0 8px 20px ${c}66` : "none",
                transition: "background 220ms ease, transform 220ms cubic-bezier(.2,.85,.25,1), box-shadow 220ms ease, border-color 220ms ease" }}>
              <span style={{ fontSize: 23, fontWeight: 900, fontFamily: MONO, lineHeight: 1,
                color: active || just ? "#fff" : c, transition: "color 220ms ease" }}>{n}</span>
              <span style={{ fontSize: 9.5, fontWeight: 700, letterSpacing: "0.05em", fontFamily: SANS,
                color: active || just ? "rgba(255,255,255,0.9)" : `${c}CC`, transition: "color 220ms ease" }}>{moodWord(n)}</span>
            </div>
          );
        })}
      </div>
      <div style={{ textAlign: "center", height: 18, marginTop: 9 }}>
        {logged !== null
          ? <span className="pop" style={{ fontSize: 12.5, fontWeight: 800, fontFamily: SANS, color: moodColor(logged) }}>✓ logged {logged} · {moodWord(logged)} at {nowHM()}</span>
          : <span style={{ fontSize: 11.5, color: P.slate, fontFamily: SANS }}>{dragging && val ? `${val} · ${moodWord(val)} — release to log` : "tap a number · or drag across"}</span>}
      </div>
    </div>
  );
};

const DreamEditor = ({ initial, onSave, onCancel }) => {

          style={{ width: 52, height: 52, borderRadius: "50%", background: "rgba(255,255,255,0.10)",

          style={{ width: 68, height: 68, borderRadius: "50%", background: P.mint, color: INK_ON_MINT,
            display: "flex", alignItems: "center", justifyContent: "center",
            boxShadow: "0 8px 26px rgba(0,229,196,0.55)" }}>
          <Icon name="check" size={38} stroke={3.4} />
        </button>
      </div>
      <textarea ref={ref} value={txt} onChange={(e) => setTxt(e.target.value)}

          color: "#F2F0F7", fontSize: 17.5, lineHeight: 1.6, fontFamily: SANS, resize: "none",
          padding: "10px 18px 24px" }} />
    </div>, document.body);
};

/* ---------- morning card · quality → rested → dream ---------- */
const MorningCard = ({ i, day, updDay, isMorning }) => {
  const PANES = [
    { key: "sleepQ", icon: "bed",     title: "Ako sa ti spalo?",      hint: "kvalita spánku 1–5", hue: HUE.sleep },
    { key: "rested", icon: "battery", title: "Ako vyspatý sa cítiš?", hint: "1–5",                hue: HUE.briefing },
    { key: "dream",  icon: "cloud",   title: "Chceš zapísať sen?",    hint: "súkromné",           hue: HUE.dream },
  ];
  const empty = (k) => day[k] === null || day[k] === "" || day[k] === undefined;
  const [pane, setPane] = useState(() => { const k = PANES.findIndex((p) => empty(p.key)); return k === -1 ? 0 : k; });
  const [editing, setEditing] = useState(false);
  const go = (d) => setPane((p) => (p + d + PANES.length) % PANES.length);
  const P0 = PANES[pane], H = P0.hue;

  const pick = (k) => (v) => {
    updDay({ [k]: v });

  };

  return (
    <React.Fragment>
      <Section i={i} style={{ padding: "16px", marginBottom: 12 }}
        tint={isMorning ? H.tint : null} glow={isMorning ? H.glow : null}>
        <div style={{ display: "flex", alignItems: "center", gap: 11, marginBottom: 4 }}>
          <span style={{ width: 34, height: 34, borderRadius: 12, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
            background: H.tint, color: H.c, transition: "background 300ms, color 300ms" }}>
            <Icon name={P0.icon} size={18} stroke={2} />
          </span>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 15.5, fontWeight: 800, color: P.text, fontFamily: SANS, lineHeight: 1.15 }}>{P0.title}</div>
            <div style={{ fontSize: 11, color: P.slate, fontFamily: SANS, marginTop: 1 }}>{P0.hint}</div>
          </div>
          <div style={{ display: "flex", gap: 5, flexShrink: 0 }}>
            <button onClick={() => go(-1)} className="press glass-hit" aria-label="Predchádzajúce"
              style={{ width: 32, height: 32, borderRadius: "50%", background: "rgba(255,255,255,0.45)", border: "1px solid rgba(255,255,255,0.55)", color: P.text, display: "flex", alignItems: "center", justifyContent: "center", transform: "rotate(90deg)" }}>
              <Icon name="chevron" size={15} stroke={2.6} />
            </button>
            <button onClick={() => go(1)} className="press glass-hit" aria-label="Ďalšie"
              style={{ width: 32, height: 32, borderRadius: "50%", background: "rgba(255,255,255,0.45)", border: "1px solid rgba(255,255,255,0.55)", color: P.text, display: "flex", alignItems: "center", justifyContent: "center", transform: "rotate(-90deg)" }}>
              <Icon name="chevron" size={15} stroke={2.6} />
            </button>
          </div>
        </div>

        <div style={{ display: "flex", gap: 5, justifyContent: "center", margin: "10px 0 14px" }}>
          {PANES.map((p, k) => (
            <button key={p.key} onClick={() => setPane(k)} aria-label={p.title}
              style={{ width: k === pane ? 22 : 7, height: 7, borderRadius: 999, border: "none", padding: 0,
                background: k === pane ? p.hue.c : !empty(p.key) ? `${p.hue.c}80` : "rgba(23,19,43,0.16)",
                transition: "all 300ms cubic-bezier(.2,.85,.25,1)" }} />
          ))}
        </div>

        <div key={pane} className="spring">
          {pane < 2 ? (
            <React.Fragment>
              <Scale5 value={day[P0.key]} onPick={pick(P0.key)} />
              <div style={{ textAlign: "center", marginTop: 10, height: 18 }}>
                {day[P0.key] ? (
                  <span style={{ fontSize: 12.5, fontWeight: 800, fontFamily: SANS, color: moodColor(day[P0.key]) }}>
                    {day[P0.key]}/5 · {moodWord(day[P0.key])}
                  </span>
                ) : <span style={{ fontSize: 11.5, color: P.slate, fontFamily: SANS }}>ťukni na číslo</span>}
              </div>
            </React.Fragment>
          ) : day.dream ? (
            <button onClick={() => setEditing(true)} className="press"
              style={{ width: "100%", textAlign: "left", background: "rgba(255,255,255,0.30)", borderRadius: 16, padding: "16px 14px", minHeight: 70, display: "flex", alignItems: "center", gap: 11 }}>
              <span style={{ flex: 1, fontSize: 15, fontFamily: SANS, color: "transparent", textShadow: "0 0 9px rgba(23,19,43,0.75)", overflow: "hidden", whiteSpace: "nowrap", textOverflow: "ellipsis", userSelect: "none" }}>{day.dream}</span>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 11, color: HUE.dream.c, fontFamily: SANS, fontWeight: 700, whiteSpace: "nowrap" }}><Icon name="eye" size={13} /> upraviť</span>
            </button>
          ) : (
            <div style={{ display: "flex", gap: 9 }}>
              <button onClick={() => setEditing(true)} className="press"
                style={{ flex: 1, height: 54, borderRadius: 16, background: P.mint, color: INK_ON_MINT, fontSize: 15.5, fontWeight: 800, fontFamily: SANS, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, boxShadow: "0 6px 18px rgba(0,229,196,0.45)" }}>
                <Icon name="check" size={19} stroke={2.6} /> Áno
              </button>
              <button onClick={() => setPane(0)} className="press glass-hit"
                style={{ flex: 1, height: 54, borderRadius: 16, background: "rgba(255,255,255,0.34)", border: "1px solid rgba(255,255,255,0.5)", color: P.slate, fontSize: 15.5, fontWeight: 800, fontFamily: SANS }}>
                Nie
              </button>
            </div>
          )}
        </div>

        {!empty(P0.key) && (
          <button onClick={() => updDay({ [P0.key]: P0.key === "dream" ? "" : null })} className="press"
            style={{ marginTop: 11, width: "100%", padding: "8px 0", borderRadius: 12, background: "rgba(210,33,79,0.10)", color: P.bad, fontSize: 12, fontWeight: 700, fontFamily: SANS, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            <Icon name="trash" size={13} /> Vymazať
          </button>
        )}
      </Section>

      {editing && (
        <DreamEditor initial={day.dream}
          onSave={(t) => { updDay({ dream: t.trim() }); setEditing(false); setTimeout(() => setPane(0), 260); }}
          onCancel={() => setEditing(false)} />
      )}
    </React.Fragment>
  );
};

/* ---------- app ---------- */
const App = () => {
  const [data, setData] = useState(loadData);
  const [saveErr, setSaveErr] = useState(false);
  const [sel, setSel] = useState(todayISO());
  const [tab, setTab] = useState("today");
  const [copied, setCopied] = useState(false);
  const [upState, setUpState] = useState("idle");
  const [upLatest, setUpLatest] = useState("");
  const [backupMsg, setBackupMsg] = useState("");
  const [draft, setDraft] = useState("");
  const [promptOff, setPromptOff] = useState(false);
  const [moodOpen, setMoodOpen] = useState(false);
  const [commOpen, setCommOpen] = useState(false);
  const fileRef = useRef(null);

  const persist = (next) => { setData(next); setSaveErr(!saveData(next)); };
  const day = data.days[sel] || emptyDay(sel);
  const updDay = (patch) => persist({ ...data, days: { ...data.days, [sel]: { ...day, ...patch } } });

  const last7 = useMemo(() => {
    const arr = [];
    for (let i = 6; i >= 0; i--) { const iso = shiftISO(todayISO(), -i); arr.push(data.days[iso] || emptyDay(iso)); }
    return arr;
  }, [data]);

  /* Advisory fires ONLY if the run of broken days reaches yesterday.
     Yesterday must be broken, plus the day before it or today.
     A 2-in-a-row earlier in the week that yesterday broke out of stays quiet. */
  const advisory = useMemo(() => {
    const t = todayISO();
    const d = (off) => data.days[shiftISO(t, off)] || emptyDay(shiftISO(t, off));
    const yest = isBrokenDay(d(-1));
    if (!yest) return false;
    return isBrokenDay(d(-2)) || isBrokenDay(d(0));
  }, [data]);

  const sleepH = hoursBetween(day.bedtime, day.wake);
  const dayMood = avgMood(day);
  const brokenToday = isBrokenDay(day);
  const isToday = sel === todayISO();
  /* morning window 4:59 – 7:00 → card rides second from the top; otherwise second from the bottom */
  const isMorningWindow = (() => { const d = new Date(), h = d.getHours(), m = d.getMinutes(); return isToday && ((h === 4 && m >= 59) || (h >= 5 && h < 7)); })();

  const addMood = (v) => updDay({ moods: [...day.moods, { id: uid(), v, t: nowHM() }] });
  const delMood = (id) => updDay({ moods: day.moods.filter((m) => m.id !== id) });
  const addComment = () => {
    const txt = draft.trim();
    if (!txt) return;
    updDay({ comments: [...(day.comments || []), { id: uid(), t: nowHM(), text: txt }] });
    setDraft("");
  };
  const delComment = (id) => updDay({ comments: (day.comments || []).filter((c) => c.id !== id) });

  const checkUpdate = async () => {
    setUpState("checking");
    try {
      const base = location.pathname.split("?")[0];
      const res = await fetch(base + "?_=" + Date.now(), { cache: "no-store" });
      const txt = await res.text();
      const m = txt.match(/APP_VERSION\s*=\s*["']([^"']+)["']/);
      const latest = m ? m[1] : null;
      if (!latest) { setUpState("error"); return; }
      setUpLatest(latest); setUpState(latest === APP_VERSION ? "current" : "available");
    } catch (e) { setUpState("error"); }
  };
  const doUpdate = () => { const base = location.pathname.split("?")[0]; location.href = base + "?v=" + Date.now(); };

  const copyAll = async () => {
    const isos = Object.keys(data.days).filter((k) => dayHasData(data.days[k])).sort();
    const lines = ["INPUTS — habit & mood log", ""];
    for (const iso of isos) {
      const d = data.days[iso], h = hoursBetween(d.bedtime, d.wake), am = avgMood(d);
      const parts = [];
      parts.push(`sleep ${h === null ? "—" : fmtHours(h)}${h !== null && h < SLEEP_MIN ? " ⚠" : ""}`);
      parts.push(`reels ${d.reels === null ? "—" : d.reels ? "Y" : "N"}${d.reels && d.reelsMins ? ` ${d.reelsMins}m` : ""}`);
      parts.push(`briefing ${d.briefing === null ? "—" : d.briefing ? "Y" : "N"}`);
      if (d.sleepQ != null) parts.push(`quality ${d.sleepQ}/10`);
      if (d.rested != null) parts.push(`rested ${d.rested}/10`);
      parts.push(`mood ${am === null ? "—" : am}${d.moods.length ? ` (${d.moods.map((m) => `${m.v}@${m.t}`).join(",")})` : ""}`);
      let line = `${prettyDate(iso)} ${dayName(iso)} | ${parts.join(" · ")}`;
      if (isBrokenDay(d)) line += ` | BROKEN: ${brokenReasons(d).join(", ")}`;
      if (d.comments && d.comments.length) d.comments.forEach((c) => { line += `\n   ${c.t} — ${c.text}`; });
      if (d.note) line += `\n   note: ${d.note}`;
      if (d.dream) line += `\n   dream: ${d.dream.replace(/\n+/g, " / ")}`;
      lines.push(line);
    }
    lines.push("", `exported ${prettyDate(todayISO())} · v${APP_VERSION}`);
    try { await navigator.clipboard.writeText(lines.join("\n")); setCopied(true); setTimeout(() => setCopied(false), 1700); } catch (e) {}
  };

  /* JSON backup — download a restorable file */
  const exportJSON = () => {
    const payload = JSON.stringify({ app: "inputs", version: APP_VERSION, exported: new Date().toISOString(), data }, null, 2);
    const blob = new Blob([payload], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `inputs-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setBackupMsg("✓ Backup saved"); setTimeout(() => setBackupMsg(""), 2200);
  };

  /* restore from a backup file — merges by day, keeping the richer copy */
  const importJSON = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const incoming = parsed && parsed.data && parsed.data.days ? parsed.data.days
                       : parsed && parsed.days ? parsed.days : null;
        if (!incoming) { setBackupMsg("✕ Not a valid backup"); setTimeout(() => setBackupMsg(""), 2600); return; }
        const merged = { ...incoming, ...data.days };
        // for overlapping days, prefer whichever has more logged (avoid clobbering with an emptier copy)
        const score = (d) => (d.bedtime?1:0)+(d.wake?1:0)+(d.reels!==null?1:0)+(d.briefing!==null?1:0)+((d.moods&&d.moods.length)||0)+((d.comments&&d.comments.length)||0)+(d.sleepQ!=null?1:0)+(d.rested!=null?1:0)+(d.note?1:0);
        Object.keys(incoming).forEach((k) => { if (data.days[k]) merged[k] = score(incoming[k]) > score(data.days[k]) ? incoming[k] : data.days[k]; });
        persist({ days: merged });
        const n = Object.keys(incoming).filter((k) => dayHasData(incoming[k])).length;
        setBackupMsg(`✓ Restored ${n} ${n === 1 ? "day" : "days"}`); setTimeout(() => setBackupMsg(""), 2800);
      } catch (err) { setBackupMsg("✕ Couldn't read file"); setTimeout(() => setBackupMsg(""), 2600); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const timeInput = (val, on) => (
    <input type="time" value={val} onChange={(e) => on(e.target.value)} className="jfocus"
      style={{ width: "100%", background: "rgba(255,255,255,0.34)", border: "1px solid rgba(255,255,255,0.5)", boxShadow: "inset 0 1px 3px rgba(50,14,80,0.07)", borderRadius: 13, padding: "12px 14px", color: P.text, fontSize: 16, fontFamily: MONO, outline: "none", transition: "border-color 180ms, box-shadow 180ms" }} />
  );

  return (
    <div className="scrollpane">
      <Background />
      <div style={{ padding: `calc(env(safe-area-inset-top) + 16px) 18px calc(${tab === "today" ? 230 : 170}px + env(safe-area-inset-bottom))`, maxWidth: 560, margin: "0 auto" }}>

        {/* header removed — date lives above the dock */}

        {/* advisory */}
        {advisory && (
          <div className="pop" style={{ position: "relative", overflow: "hidden", background: "linear-gradient(125deg, #2A1245 0%, #4A1B52 55%, #7A2140 100%)", border: "1px solid rgba(255,255,255,0.18)", borderRadius: 24, padding: "17px 18px", marginBottom: 16, boxShadow: "0 16px 40px rgba(40,10,60,0.45), inset 0 1px 0 rgba(255,255,255,0.2)" }}>
            <div style={{ position: "absolute", inset: 0, pointerEvents: "none", background: "radial-gradient(120% 90% at 100% 0%, rgba(255,92,138,0.22), transparent 60%)" }} />
            <div style={{ display: "flex", alignItems: "center", gap: 12, position: "relative" }}>
              <div className="pulse" style={{ width: 10, height: 10, borderRadius: "50%", background: "#FF5C8A", flexShrink: 0, boxShadow: "0 0 12px #FF5C8A" }} />
              <div>
                <div style={{ fontSize: 15.5, fontWeight: 800, color: "#fff", fontFamily: SANS }}>Restore your inputs before trading.</div>
                <div style={{ fontSize: 12.5, color: "rgba(255,255,255,0.72)", fontFamily: SANS, marginTop: 3 }}>The broken run reaches yesterday. Reset sleep, briefing, screen first.</div>
              </div>
            </div>
          </div>
        )}

        {tab === "today" ? (
          <div key="today" className="fade">
            {/* time-aware prompt · evening asks bedtime, early morning asks wake */}
            {(() => {
              if (!isToday || promptOff) return null;
              const hr = new Date().getHours();
              const evening = hr >= 19 || hr < 5;
              const morning = hr >= 5 && hr < 8;
              const ask = evening && !day.bedtime ? "bed" : morning && !day.wake ? "wake" : null;
              if (!ask) return null;
              const isBed = ask === "bed";
              const c = isBed ? HUE.sleep.c : "#F2610C";
              return (
                <div className="pop" style={{ position: "relative", overflow: "hidden", borderRadius: 24, padding: "18px", marginBottom: 14,
                  background: isBed ? "linear-gradient(125deg, #3A1C7A 0%, #6C3FE0 100%)" : "linear-gradient(125deg, #C8541F 0%, #F9A03F 100%)",
                  boxShadow: `0 12px 30px ${isBed ? "rgba(60,20,120,0.4)" : "rgba(200,84,31,0.38)"}` }}>
                  <div style={{ position: "absolute", inset: 0, pointerEvents: "none", background: "radial-gradient(110% 80% at 100% 0%, rgba(255,255,255,0.2), transparent 62%)" }} />
                  <button onClick={() => setPromptOff(true)} className="press" aria-label="Dismiss"
                    style={{ position: "absolute", top: 12, right: 12, width: 28, height: 28, borderRadius: "50%", background: "rgba(255,255,255,0.18)", color: "#fff", fontSize: 15, lineHeight: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>×</button>
                  <div style={{ position: "relative", display: "flex", alignItems: "center", gap: 11, marginBottom: 14 }}>
                    <span style={{ width: 38, height: 38, borderRadius: 13, background: "rgba(255,255,255,0.2)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      <Icon name={isBed ? "moon" : "sunrise"} size={20} stroke={2} />
                    </span>
                    <div>
                      <div style={{ fontSize: 16.5, fontWeight: 800, color: "#fff", fontFamily: SANS, lineHeight: 1.2 }}>
                        {isBed ? "When are you going to sleep?" : "When did you wake up?"}
                      </div>
                      <div style={{ fontSize: 11.5, color: "rgba(255,255,255,0.72)", fontFamily: SANS, marginTop: 2 }}>
                        {isBed ? "Set it now, log the wake time in the morning." : "Good morning — close off last night."}
                      </div>
                    </div>
                  </div>
                  <div style={{ position: "relative", display: "flex", gap: 9 }}>
                    <input type="time" value={isBed ? day.bedtime : day.wake}
                      onChange={(e) => updDay(isBed ? { bedtime: e.target.value } : { wake: e.target.value })}
                      style={{ flex: 1, background: "rgba(255,255,255,0.94)", border: "none", borderRadius: 14, padding: "13px 15px", color: P.text, fontSize: 17, fontFamily: MONO, outline: "none" }} />
                    <button onClick={() => updDay(isBed ? { bedtime: nowHM() } : { wake: nowHM() })} className="press"
                      style={{ padding: "0 18px", borderRadius: 14, background: P.mint, color: INK_ON_MINT, fontSize: 13.5, fontWeight: 800, fontFamily: SANS, whiteSpace: "nowrap", boxShadow: "0 4px 14px rgba(0,229,196,0.45)" }}>
                      Now
                    </button>
                  </div>
                </div>
              );
            })()}

            {/* sleep */}
            <Section i={1} style={{ padding: "16px", marginBottom: 12 }} tint={sleepH !== null && sleepH < SLEEP_MIN ? P.lossTint : sleepH !== null ? HUE.sleep.tint : null} glow={sleepH !== null && sleepH >= SLEEP_MIN ? HUE.sleep.glow : null}>
              <Label right={sleepH !== null && (
                <span className="tick-in" style={{ fontSize: 16, fontWeight: 800, fontFamily: MONO, color: sleepH < SLEEP_MIN ? P.bad : HUE.sleep.c, textShadow: "none" }}>
                  {fmtHours(sleepH)}{sleepH < SLEEP_MIN ? " ⚠" : ""}
                </span>
              )} icon="moon" color={HUE.sleep.c}>Sleep</Label>
              <div style={{ display: "flex", gap: 10 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 11, color: P.faint, marginBottom: 5, fontFamily: SANS }}>Bedtime</div>
                  {timeInput(day.bedtime, (v) => updDay({ bedtime: v }))}
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 11, color: P.faint, marginBottom: 5, fontFamily: SANS }}>Wake</div>
                  {timeInput(day.wake, (v) => updDay({ wake: v }))}
                </div>
              </div>
              {sleepH !== null && sleepH < SLEEP_MIN && <div className="fade" style={{ marginTop: 10, fontSize: 12, color: P.bad, fontFamily: SANS }}>Under {SLEEP_MIN}h — recovery debt.</div>}
            </Section>

            {/* phone */}

            {/* morning card · top slot only between 4:59 and 7:00 */}
            {isMorningWindow && <MorningCard i={2} day={day} updDay={updDay} isMorning={true} />}

            {/* mood */}
            <Section i={2} style={{ padding: "16px", marginBottom: 12 }} tint={dayMood !== null && dayMood < 3 ? P.lossTint : dayMood !== null && dayMood >= 4 ? HUE.mood.tint : null}>
              <Label right={dayMood !== null && (
                <span className="pop" style={{ fontSize: 14, fontWeight: 800, fontFamily: MONO, color: dayMood < 3 ? P.bad : dayMood >= 4 ? P.ice : P.dim }}>avg {dayMood}</span>
              )} icon="heart" color={HUE.mood.c}>Mood / state</Label>
              <MoodScale onPick={addMood} />
              {day.moods.length > 0 && (() => {
                const many = day.moods.length > 2;
                const shown = many && !moodOpen ? day.moods.slice(-2) : day.moods;
                const hidden = day.moods.length - shown.length;
                return (
                  <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 7 }}>
                    {many && !moodOpen && (
                      <button onClick={() => setMoodOpen(true)} className="press glass-hit"
                        style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "9px 0", borderRadius: 13,
                          background: "rgba(255,255,255,0.30)", color: P.slate, fontSize: 12, fontWeight: 700, fontFamily: SANS }}>
                        <span style={{ display: "inline-flex", gap: 3 }}>
                          {day.moods.slice(0, Math.min(hidden, 6)).map((m, j) => (
                            <span key={j} style={{ width: 7, height: 7, borderRadius: "50%", background: moodColor(m.v), opacity: 0.85 }} />
                          ))}
                        </span>
                        {hidden} earlier {hidden === 1 ? "entry" : "entries"}
                        <span className="chev" style={{ display: "flex", color: HUE.mood.c }}><Icon name="chevron" size={15} stroke={2.4} /></span>
                      </button>
                    )}
                    {shown.map((m, k) => (
                      <div key={m.id} className="spring" style={{ "--i": k, display: "flex", alignItems: "center", gap: 11, background: "rgba(255,255,255,0.34)", borderRadius: 14, padding: "9px 13px", border: `1px solid ${moodColor(m.v)}1F` }}>
                        <span style={{ width: 28, height: 28, borderRadius: 9, background: `${moodColor(m.v)}22`, color: moodColor(m.v), fontFamily: MONO, fontWeight: 800, fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, boxShadow: `inset 0 0 0 1px ${moodColor(m.v)}33` }}>{m.v}</span>
                        <span style={{ fontSize: 13, color: P.dim, fontFamily: MONO }}>{m.t}</span>
                        <span style={{ fontSize: 11.5, color: `${moodColor(m.v)}`, fontFamily: SANS, fontWeight: 700, opacity: 0.8 }}>{moodWord(m.v)}</span>
                        <button onClick={() => delMood(m.id)} className="press" aria-label="Delete entry"
                          style={{ marginLeft: "auto", width: 26, height: 26, borderRadius: "50%", flexShrink: 0,
                            display: "flex", alignItems: "center", justifyContent: "center",
                            background: "rgba(255,255,255,0.5)", color: P.slate, fontSize: 15, lineHeight: 1, paddingBottom: 1 }}>×</button>
                      </div>
                    ))}
                    {many && moodOpen && (
                      <button onClick={() => setMoodOpen(false)} className="press"
                        style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 7, padding: "8px 0", borderRadius: 13,
                          background: "transparent", color: P.slate, fontSize: 12, fontWeight: 700, fontFamily: SANS }}>
                        <span className="chev up" style={{ display: "flex", color: HUE.mood.c }}><Icon name="chevron" size={15} stroke={2.4} /></span>
                        Collapse
                      </button>
                    )}
                  </div>
                );
              })()}
            </Section>

            {/* comments — timestamped, deletable */}
            <Section i={3} style={{ padding: "16px", marginBottom: 12 }}>
              <Label icon="chat" color={HUE.briefing.c} right={(day.comments || []).length > 0 && (
                <span style={{ fontSize: 11.5, fontWeight: 700, fontFamily: MONO, color: HUE.briefing.c }}>{day.comments.length}</span>
              )}>Comments</Label>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={draft} onChange={(e) => setDraft(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") addComment(); }}
                  placeholder="what's happening right now…" className="jfocus"
                  style={{ flex: 1, minWidth: 0, background: "rgba(255,255,255,0.34)", border: "1px solid rgba(255,255,255,0.5)", boxShadow: "inset 0 1px 3px rgba(50,14,80,0.07)", borderRadius: 14, padding: "12px 14px", color: P.text, fontSize: 15, fontFamily: SANS, outline: "none", transition: "border-color 180ms, box-shadow 180ms" }} />
                <button onClick={addComment} className="press" aria-label="Add comment" disabled={!draft.trim()}
                  style={{ width: 48, borderRadius: 14, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
                    background: draft.trim() ? P.mint : "rgba(23,19,43,0.06)", color: draft.trim() ? INK_ON_MINT : P.faint,
                    boxShadow: draft.trim() ? "0 4px 14px rgba(0,229,196,0.45)" : "none", transition: "background 200ms ease, color 200ms ease" }}>
                  <Icon name="plus" size={20} stroke={2.6} />
                </button>
              </div>
              {(day.comments || []).length > 0 && (() => {
                const many = day.comments.length > 2;
                const shown = many && !commOpen ? day.comments.slice(-2) : day.comments;
                const hidden = day.comments.length - shown.length;
                return (
                <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 7 }}>
                  {many && !commOpen && (
                    <button onClick={() => setCommOpen(true)} className="press glass-hit"
                      style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 7, padding: "9px 0", borderRadius: 13,
                        background: "rgba(255,255,255,0.30)", color: P.slate, fontSize: 12, fontWeight: 700, fontFamily: SANS }}>
                      <Icon name="chat" size={13} />{hidden} earlier {hidden === 1 ? "comment" : "comments"}
                      <span className="chev" style={{ display: "flex", color: HUE.briefing.c }}><Icon name="chevron" size={15} stroke={2.4} /></span>
                    </button>
                  )}
                  {shown.map((c, k) => (
                    <div key={c.id} className="spring" style={{ "--i": k, display: "flex", alignItems: "flex-start", gap: 10, background: "rgba(255,255,255,0.34)", borderRadius: 14, padding: "10px 12px" }}>
                      <span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, fontFamily: MONO, color: HUE.briefing.c, fontWeight: 700, flexShrink: 0, paddingTop: 2 }}>
                        <Icon name="clock" size={12} />{c.t}
                      </span>
                      <span style={{ flex: 1, fontSize: 14.5, color: P.text, fontFamily: SANS, lineHeight: 1.4, wordBreak: "break-word" }}>{c.text}</span>
                      <button onClick={() => delComment(c.id)} className="press" aria-label="Delete comment"
                        style={{ width: 26, height: 26, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
                          background: "rgba(255,255,255,0.5)", color: P.slate, fontSize: 15, lineHeight: 1, paddingBottom: 1 }}>×</button>
                    </div>
                  ))}
                  {many && commOpen && (
                    <button onClick={() => setCommOpen(false)} className="press"
                      style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 7, padding: "8px 0", borderRadius: 13,
                        background: "transparent", color: P.slate, fontSize: 12, fontWeight: 700, fontFamily: SANS }}>
                      <span className="chev up" style={{ display: "flex", color: HUE.briefing.c }}><Icon name="chevron" size={15} stroke={2.4} /></span>
                      Collapse
                    </button>
                  )}
                </div>
                );
              })()}
            </Section>

            {/* reels */}
            <ToggleCard i={4} icon="play" hue="reels" label="Reels / scrolling?" value={day.reels} onChange={(v) => updDay({ reels: v })} goodValue={false}>
              {day.reels && (
                <div className="fade" style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 14 }}>
                  <input value={day.reelsMins} onChange={(e) => updDay({ reelsMins: e.target.value.replace(/[^0-9]/g, "") })} inputMode="numeric" placeholder="rough minutes" className="jfocus"
                    style={{ flex: 1, background: "rgba(23,19,43,0.04)", border: `1px solid ${(parseInt(day.reelsMins)||0) >= 30 ? "rgba(210,33,79,0.5)" : "rgba(23,19,43,0.08)"}`, borderRadius: 12, padding: "11px 14px", color: P.text, fontSize: 15, fontFamily: MONO, outline: "none", transition: "border-color 180ms" }} />
                  <span className={(parseInt(day.reelsMins)||0) >= 30 ? "pop" : ""} style={{ fontSize: 12, fontWeight: (parseInt(day.reelsMins)||0) >= 30 ? 700 : 400, color: (parseInt(day.reelsMins)||0) >= 30 ? P.bad : P.faint, fontFamily: SANS, whiteSpace: "nowrap" }}>{(parseInt(day.reelsMins)||0) >= 30 ? "binge ⚠" : "min"}</span>
                </div>
              )}
            </ToggleCard>

            {/* briefing */}
            <ToggleCard i={5} icon="sun" hue="briefing" label="Morning briefing done?" value={day.briefing} onChange={(v) => updDay({ briefing: v })} goodValue={true} />

            {/* morning card · parked second from the bottom outside the morning window */}
            {!isMorningWindow && <MorningCard i={6} day={day} updDay={updDay} isMorning={false} />}

            {/* note */}
            <Section i={6} style={{ padding: "16px", marginBottom: 12 }}>
              <Label icon="pen" color={HUE.note.c}>Note</Label>
              <input value={day.note} onChange={(e) => updDay({ note: e.target.value })} placeholder="one line, optional" className="jfocus"
                style={{ width: "100%", background: "rgba(255,255,255,0.34)", border: "1px solid rgba(255,255,255,0.5)", boxShadow: "inset 0 1px 3px rgba(50,14,80,0.07)", borderRadius: 12, padding: "12px 14px", color: P.text, fontSize: 15, fontFamily: SANS, outline: "none", transition: "border-color 180ms, box-shadow 180ms" }} />
            </Section>

            {/* status chip */}
            {dayHasData(day) && (
              <div className="pop" style={{ textAlign: "center", marginTop: 6 }}>
                <span style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "9px 17px", borderRadius: 999,
                  background: brokenToday ? P.bad : P.mint,
                  border: "1px solid rgba(255,255,255,0.5)",
                  color: brokenToday ? "#fff" : INK_ON_MINT, fontSize: 13, fontWeight: 800, fontFamily: SANS,
                  boxShadow: brokenToday ? "0 6px 18px rgba(210,33,79,0.35)" : "0 6px 18px rgba(0,229,196,0.45)" }}>
                  <span className="breathe" style={{ width: 7, height: 7, borderRadius: "50%", background: "currentColor" }} />
                  {brokenToday ? `Broken day · ${brokenReasons(day).join(", ")}` : "Inputs healthy"}
                </span>
              </div>
            )}
          </div>
        ) : (
          <div key="week" className="fade">
            {/* input health */}
            <Section i={1} style={{ padding: "18px 16px", marginBottom: 12 }}>
              <Label icon="activity" color={P.ice}>Input health · last 7 days</Label>
              {(() => {
                const withData = last7.filter(dayHasData);
                const broken = last7.filter(isBrokenDay).length;
                const healthy = withData.length - broken;
                const pct = withData.length ? Math.round((healthy / withData.length) * 100) : 0;
                return (
                  <div style={{ display: "flex", alignItems: "center", gap: 18 }}>
                    <Ring pct={pct} size={84} stroke={7} color={pct >= 60 ? "#00C9AB" : pct >= 40 ? P.violet : P.bad}>
                      <span className="tick-in" style={{ fontSize: 22, fontWeight: 800, fontFamily: MONO, color: P.text, animationDelay: "400ms" }}>{pct}%</span>
                      <span style={{ fontSize: 8, letterSpacing: "0.16em", color: P.faint, fontFamily: SANS, marginTop: 1 }}>HEALTHY</span>
                    </Ring>
                    <div style={{ flex: 1 }}>
                      <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 8 }}>
                        <span className="tick-in" style={{ fontSize: 28, fontWeight: 800, fontFamily: MONO, color: broken > 0 ? P.bad : "#00A891", animationDelay: "300ms" }}>{broken}</span>
                        <span style={{ fontSize: 13, color: P.dim, fontFamily: SANS }}>broken {broken === 1 ? "day" : "days"}</span>
                      </div>
                      <div style={{ display: "flex", gap: 5 }}>
                        {last7.map((d, i) => {
                          const has = dayHasData(d), brk = isBrokenDay(d);
                          return <div key={d.date} className="bar-grow" style={{ "--i": i, flex: 1, height: 42, borderRadius: 9,
                            background: !has ? "rgba(23,19,43,0.10)" : brk ? "linear-gradient(180deg, #F2610C, #D2214F)" : "linear-gradient(180deg, #00E5C4, #00A891)", opacity: !has ? 0.6 : 1,
                            boxShadow: has ? "0 3px 10px rgba(60,20,90,0.2)" : "none" }} />;
                        })}
                      </div>
                      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 5 }}>
                        {last7.map((d) => <span key={d.date} style={{ flex: 1, textAlign: "center", fontSize: 10.5, fontWeight: 700, color: P.dim, fontFamily: SANS }}>{dayName(d.date)[0]}</span>)}
                      </div>
                    </div>
                  </div>
                );
              })()}
            </Section>

            {/* sleep trend */}
            <Section i={2} style={{ padding: "18px 16px", marginBottom: 12 }}>
              <Label right={(() => {
                const vals = last7.map((d) => hoursBetween(d.bedtime, d.wake)).filter((v) => v !== null);
                const avg = vals.length ? Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10 : null;
                return avg !== null && <span style={{ fontSize: 12, fontFamily: MONO, color: avg < SLEEP_MIN ? P.bad : HUE.sleep.c, fontWeight: 700 }}>avg {avg}h</span>;
              })()} icon="moon" color={HUE.sleep.c}>Sleep hours trend</Label>
              <SleepBars days={last7} />
              <div style={{ fontSize: 11.5, fontWeight: 600, color: P.slate, fontFamily: SANS, marginTop: 12, textAlign: "center" }}>Mint line = {SLEEP_MIN}h floor · red bar = under</div>
            </Section>

            {/* mood trend */}
            <Section i={3} style={{ padding: "18px 16px", marginBottom: 12 }}>
              <Label right={(() => {
                const vals = last7.map(avgMood).filter((v) => v !== null);
                const avg = vals.length ? Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10 : null;
                return avg !== null && <span style={{ fontSize: 12, fontFamily: MONO, color: moodColor(Math.round(avg)) }}>avg {avg}</span>;
              })()} icon="heart" color={HUE.mood.c}>Mood trend</Label>
              <MoodLine days={last7} />
              <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6 }}>
                {last7.map((d) => <span key={d.date} style={{ flex: 1, textAlign: "center", fontSize: 11, fontWeight: 700, color: P.dim, fontFamily: SANS }}>{dayName(d.date)[0]}</span>)}
              </div>
            </Section>

            {/* direction */}
            <Section i={4} style={{ padding: "16px", marginBottom: 12 }}>
              <Label icon="spark" color={HUE.briefing.c}>Direction</Label>
              {(() => {
                const half = (arr) => {
                  const a = arr.slice(0,4).filter((v) => v !== null), b = arr.slice(4).filter((v) => v !== null);
                  if (!a.length || !b.length) return null;
                  return (b.reduce((x,y)=>x+y,0)/b.length) - (a.reduce((x,y)=>x+y,0)/a.length);
                };
                const sleepSlope = half(last7.map((d) => hoursBetween(d.bedtime, d.wake)));
                const moodSlope = half(last7.map(avgMood));
                const reelsSlope = half(last7.map((d) => d.reels === true ? (parseInt(d.reelsMins)||1) : d.reels === false ? 0 : null));
                const Row = ({ label, slope, unit, goodUp, i }) => {
                  if (slope === null) return (
                    <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", fontFamily: SANS }}>
                      <span style={{ fontSize: 14, fontWeight: 600, color: P.text }}>{label}</span><span style={{ fontSize: 12.5, fontWeight: 600, color: P.slate }}>not enough data</span>
                    </div>
                  );
                  const up = slope > 0.05, down = slope < -0.05;
                  const good = (goodUp && up) || (!goodUp && down), bad = (goodUp && down) || (!goodUp && up);
                  const color = good ? (label === "Sleep" ? HUE.sleep.c : label === "Mood" ? HUE.mood.c : HUE.reels.c) : bad ? P.bad : P.slate;
                  return (
                    <div className="fade-slide" style={{ "--i": i, display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", fontFamily: SANS }}>
                      <span style={{ fontSize: 14, color: P.text }}>{label}</span>
                      <span style={{ fontSize: 14, fontWeight: 700, color, fontFamily: MONO }}>{up ? "↑" : down ? "↓" : "→"} {Math.abs(slope) < 0.05 ? "flat" : `${slope > 0 ? "+" : ""}${Math.round(slope*10)/10}${unit}`}</span>
                    </div>
                  );
                };
                return (
                  <div>
                    <Row label="Sleep" slope={sleepSlope} unit="h" goodUp={true} i={0} />
                    <div style={{ height: 1, background: P.border }} />
                    <Row label="Mood" slope={moodSlope} unit="" goodUp={true} i={1} />
                    <div style={{ height: 1, background: P.border }} />
                    <Row label="Reels" slope={reelsSlope} unit="m" goodUp={false} i={2} />
                    <div style={{ fontSize: 11, fontWeight: 600, color: P.slate, fontFamily: SANS, marginTop: 8 }}>Later 3 days vs earlier 4 — the slope of your inputs.</div>
                  </div>
                );
              })()}
            </Section>
          </div>
        )}

        {/* backup / restore */}
        <div className="rise" style={{ "--i": 6, ...card(), borderRadius: 18, padding: "15px 16px", marginTop: 16 }}>
          <Label icon="copy" color={HUE.note.c}>Backup</Label>
          <div style={{ fontSize: 12, color: P.dim, fontFamily: SANS, lineHeight: 1.45, marginBottom: 13 }}>
            Save a file with all your days — moods, comments, dreams. Restore it any time.
          </div>
          <div style={{ display: "flex", gap: 9 }}>
            <button onClick={exportJSON} className="press shine"
              style={{ flex: 1, padding: "12px 0", borderRadius: 13, fontSize: 13.5, fontWeight: 700, fontFamily: SANS, border: "none",
                background: GRAD_PRIMARY, color: INK_ON_MINT, boxShadow: "0 6px 18px rgba(0,229,196,0.45)" }}>
              ↓ Back up
            </button>
            <button onClick={() => fileRef.current && fileRef.current.click()} className="press"
              style={{ flex: 1, padding: "12px 0", borderRadius: 13, fontSize: 13.5, fontWeight: 700, fontFamily: SANS, border: "none",
                background: "rgba(23,19,43,0.06)", color: P.dim }}>
              ↑ Restore
            </button>
            <input ref={fileRef} type="file" accept="application/json,.json" onChange={importJSON} style={{ display: "none" }} />
          </div>
          {backupMsg && (
            <div className="pop" style={{ textAlign: "center", marginTop: 11, fontSize: 12.5, fontWeight: 700, fontFamily: SANS, color: backupMsg[0] === "✓" ? "#00A891" : P.bad }}>{backupMsg}</div>
          )}
        </div>

        {/* version */}
        <div style={{ textAlign: "center", marginTop: 20 }}>
          {upState === "available" ? (
            <button onClick={doUpdate} style={{ background: GRAD_PRIMARY, color: INK_ON_MINT, fontSize: 13.5, fontWeight: 800, padding: "13px 24px", borderRadius: 999, fontFamily: SANS, boxShadow: "0 6px 18px rgba(0,229,196,0.45)" }} className="press shine">Update now → v{upLatest}</button>
          ) : (
            <button onClick={checkUpdate} className="press" style={{ background: "rgba(255,255,255,0.72)", border: "1px solid rgba(255,255,255,0.6)", color: P.dim, fontSize: 12.5, fontWeight: 600, padding: "10px 18px", borderRadius: 999, fontFamily: SANS }}>{upState === "checking" ? "Checking…" : "Check for updates"}</button>
          )}
          <div style={{ fontSize: 10.5, color: "rgba(255,255,255,0.75)", fontFamily: MONO, marginTop: 8, textShadow: "0 1px 4px rgba(60,20,90,0.5)" }}>
            {upState === "current" ? "✓ newest · " : upState === "error" ? "offline · " : ""}v{APP_VERSION}
          </div>
        </div>
        {saveErr && <div style={{ marginTop: 12, textAlign: "center", fontSize: 12, color: P.bad, fontFamily: SANS }}>Storage blocked — data may not persist.</div>}
      </div>

      {/* ---- date row: bare, transparent, above the dock (today only) ---- */}
      {tab === "today" && (
        <div style={{ position: "fixed", left: 0, right: 0, bottom: "max(78px, calc(env(safe-area-inset-bottom) + 78px))", zIndex: 10, display: "flex", alignItems: "center", justifyContent: "center", gap: 20, pointerEvents: "none" }}>
          <button onClick={() => setSel(shiftISO(sel, -1))} className="press"
            style={{ pointerEvents: "auto", width: 34, height: 34, borderRadius: "50%", background: "rgba(255,255,255,0.42)", border: "1px solid rgba(255,255,255,0.5)", backdropFilter: "blur(14px)", WebkitBackdropFilter: "blur(14px)", color: P.text, fontSize: 20, display: "flex", alignItems: "center", justifyContent: "center" }}>‹</button>
          <div style={{ textAlign: "center", minWidth: 128, pointerEvents: "none", padding: "7px 16px", borderRadius: 999,
            background: "linear-gradient(150deg, rgba(255,255,255,0.62), rgba(255,255,255,0.44))",
            border: "1px solid rgba(255,255,255,0.5)",
            backdropFilter: "blur(22px) saturate(180%)", WebkitBackdropFilter: "blur(22px) saturate(180%)",
            boxShadow: "0 8px 22px rgba(50,14,80,0.2), inset 0 1px 0 rgba(255,255,255,0.8)" }}>
            <div style={{ fontSize: 14, fontWeight: 800, color: P.text, fontFamily: SANS }}>{isToday ? "Today" : dayNameLong(sel)}</div>
            <div style={{ fontSize: 11, color: P.dim, fontFamily: MONO, marginTop: 1 }}>{prettyDate(sel)}</div>
          </div>
          <button onClick={() => setSel(shiftISO(sel, 1))} disabled={isToday} className="press"
            style={{ pointerEvents: "auto", width: 34, height: 34, borderRadius: "50%", background: "rgba(255,255,255,0.42)", border: "1px solid rgba(255,255,255,0.5)", backdropFilter: "blur(14px)", WebkitBackdropFilter: "blur(14px)", color: isToday ? "rgba(23,19,43,0.25)" : P.text, fontSize: 20, opacity: isToday ? 0.5 : 1, display: "flex", alignItems: "center", justifyContent: "center" }}>›</button>
        </div>
      )}

      {/* ---- dock: single frosted bar, borderless, soft sliding selection ---- */}
      <div style={{ position: "fixed", left: 0, right: 0, bottom: "max(14px, env(safe-area-inset-bottom))", zIndex: 10, display: "flex", justifyContent: "center", padding: "0 16px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, padding: 5, borderRadius: 22,
          background: "linear-gradient(150deg, rgba(255,255,255,0.66), rgba(255,255,255,0.44))", border: "1px solid rgba(255,255,255,0.55)",
          backdropFilter: "blur(34px) saturate(200%)", WebkitBackdropFilter: "blur(34px) saturate(200%)",
          boxShadow: "0 16px 44px rgba(50,14,80,0.3), inset 0 1px 0 rgba(255,255,255,0.85)" }}>
          {/* segmented Today / 7-day — soft sliding highlight, no borders */}
          <div style={{ position: "relative", display: "flex", borderRadius: 17, overflow: "hidden" }}>
            <div style={{ position: "absolute", top: 0, bottom: 0, left: tab === "today" ? 0 : "50%", width: "50%",
              background: GRAD_VIOLET,
              borderRadius: 17, transition: "left 320ms cubic-bezier(.3,.85,.35,1)", boxShadow: "0 4px 14px rgba(108,63,224,0.45)" }} />
            {[["today", "Today"], ["week", "7-day"]].map(([k, l]) => (
              <button key={k} onClick={() => setTab(k)} className="press"
                style={{ position: "relative", zIndex: 1, minWidth: 92, padding: "12px 0", borderRadius: 17, fontSize: 14, fontWeight: 700, fontFamily: SANS,
                  background: "transparent", border: "none", color: tab === k ? "#fff" : P.slate, transition: "color 260ms ease" }}>
                {l}
              </button>
            ))}
          </div>
          {/* copy — borderless, tints on success */}
          <button onClick={copyAll} className="press" aria-label="Copy all stats" title="Copy all stats"
            style={{ padding: "12px 18px", borderRadius: 17, fontSize: 14, fontWeight: 700, fontFamily: SANS, display: "inline-flex", alignItems: "center", gap: 7, border: "none",
              background: copied ? GRAD_PRIMARY : "rgba(23,19,43,0.06)",
              color: copied ? INK_ON_MINT : P.slate, transition: "background 300ms ease, color 300ms ease",
              boxShadow: copied ? "0 4px 16px rgba(0,229,196,0.5)" : "none" }}>
            {copied ? <React.Fragment>✓ Copied</React.Fragment> : <React.Fragment><Icon name="copy" size={16} /> Copy</React.Fragment>}
          </button>
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
